name: CI

on:
    push:
    pull_request:
        branches:
            - master
            - main
    workflow_dispatch:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: prefix-dev/setup-pixi@v0.10.1
              with:
                  cache: true
            - name: Install project environment
              run: pixi install
            - name: Run Ruff format check
              run: pixi run format-check
            - name: Run Ruff linting
              run: pixi run lint

    test:
        needs: lint
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # Required for setuptools-scm to determine version
            - uses: prefix-dev/setup-pixi@v0.10.1
              with:
                  cache: true
            - name: Install project environment
              run: pixi install
            - name: Run tests
              run: pixi run test
